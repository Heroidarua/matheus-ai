<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="ADA-M — assistente pessoal para programação, Linux, Termux e arquivos.">
  <title>ADA-M</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;550;600;650;700&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: dark; --bg:#000000; --panel:#0b0b0b; --panel2:#141414; --text:#f5f5f5; --muted:#a3a3a3; --accent:#70e1c1; --border:#292929; }
    body.light-theme { color-scheme:light; --bg:#f5f7f8; --panel:#ffffff; --panel2:#edf0f2; --text:#17191b; --muted:#5d666c; --accent:#087e68; --border:#d7dde0; }
    body.light-theme .welcome { background:var(--panel); }
    body.light-theme form { background:rgba(245,247,248,.98); }
    body.light-theme .assistant-content pre { background:#f0f2f3; }
    body.light-theme .assistant-content :not(pre) > code { background:#e8ecee; }
    .web-search-toggle { margin:0; }
    .web-sources { margin-top:14px;padding-top:10px;border-top:1px solid var(--border);font-size:13px; }
    .web-sources ol { padding-left:22px;margin:7px 0 0; }
    .web-sources li { margin:8px 0; }
    .web-sources a { color:var(--accent);overflow-wrap:anywhere; }
    .web-sources p { margin:3px 0 0;color:var(--muted);font-size:12px; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:var(--bg); color:var(--text); font:16px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; display:flex; justify-content:center; }
    .app { width:min(900px,100%); min-height:100vh; display:flex; flex-direction:column; padding:22px 18px 16px; }
    header { display:flex; align-items:center; gap:12px; padding:8px 4px 20px; border-bottom:1px solid var(--border); }
    .logo { width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--accent);color:#081b1a;font-weight:900;font-size:20px; }
    h1 { margin:0;font-size:21px;letter-spacing:-.5px; } .subtitle { color:var(--muted);font-size:13px; }
    .status { margin-left:auto;color:var(--accent);font-size:12px;white-space:nowrap; }
    #messages { flex:1; display:flex;flex-direction:column;gap:14px;padding:22px 0; }
    .welcome { padding:25px 20px;border:1px solid var(--border);border-radius:18px;background:#0b0b0b; }
    .welcome h2 { margin:0 0 8px;font-size:22px; } .welcome p { margin:0;color:var(--muted); }
    .bubble { max-width:88%;white-space:pre-wrap;overflow-wrap:anywhere;padding:13px 16px;border-radius:16px;border:1px solid var(--border); }
    .user { align-self:flex-end;background:#191919;border-bottom-right-radius:5px; }
    .assistant { align-self:flex-start;background:var(--panel);border-bottom-left-radius:5px; }
    .error { color:#ffb5b5;border-color:#7e343b; }
    .attachments { display:flex;flex-wrap:wrap;gap:8px;margin-top:10px; }
    .attachment-chip { font-size:12px;color:var(--muted);background:#080808;border:1px solid var(--border);border-radius:9px;padding:6px 9px;max-width:220px;overflow-wrap:anywhere; }
    .bubble-image { display:block;max-width:min(260px,100%);max-height:220px;object-fit:contain;border-radius:10px;margin-top:10px;border:1px solid var(--border); }
    form { position:sticky;bottom:0;background:linear-gradient(to bottom,transparent 0%,rgba(0,0,0,.96) 18%);padding:18px 0 8px; }
    .input-wrap { display:flex;align-items:flex-end;gap:8px;padding:9px 10px 9px 16px;border:1px solid #444;border-radius:28px;background:#303030;box-shadow:0 4px 18px rgba(0,0,0,.18);transition:border-color .18s,box-shadow .18s; }
    .input-wrap:focus-within { border-color:#5b5b5b;box-shadow:0 0 0 1px rgba(255,255,255,.025); }
    #prompt { flex:1;resize:none;min-width:0;min-height:28px;max-height:200px;border:0;outline:0;background:transparent;color:var(--text);font:inherit;font-size:15px;line-height:1.5;padding:8px 0;overflow-y:auto; }
    #prompt::placeholder { color:#a0a0a0; }
    button { border:0;border-radius:12px;background:var(--accent);color:#071b18;font-weight:750;padding:13px 17px;cursor:pointer; }
    #voice-button { background:transparent;border:0;color:#ececec; }
    #voice-button:hover { background:#414141; }
    #send { width:38px;height:38px;min-width:38px;padding:0;border-radius:50%;background:#f3f3f3;color:#202020;display:grid;place-items:center;flex-shrink:0; }
    #send::after { content:"↑";font-size:23px;line-height:1;font-weight:500; }
    #send { font-size:0; }
    #send:disabled { background:#8a8a8a;color:#222; }
    .input-wrap .tool-btn { align-self:flex-end; }
    button:disabled { opacity:.55;cursor:wait; }
    .tools { display:flex;gap:8px;flex-wrap:wrap;margin-top:9px; }
    .mode-toggle { display:flex;align-items:center;gap:9px;margin:10px 2px 0;color:var(--muted);font-size:13px; }
    .mode-toggle input { width:17px;height:17px;accent-color:var(--accent); }
    .mode-badge { color:var(--accent);font-size:12px;margin-left:4px; }
    .tool-btn { background:var(--panel2);border:1px solid var(--border);color:var(--text);font-size:13px;font-weight:550;padding:9px 12px; }
    .tool-btn span { margin-right:5px; }
    .selected-files { display:flex;flex-wrap:wrap;gap:7px;margin:8px 2px 0; }
    .selected-file { display:flex;align-items:center;gap:7px;border:1px solid var(--border);background:var(--panel2);border-radius:10px;padding:6px 9px;font-size:12px;color:var(--text); }
    .remove-file { padding:0 3px;background:transparent;color:#ffb5b5;font-size:16px; }
    .hint { color:var(--muted);font-size:11px;text-align:center;padding-top:9px; }
    .quick { display:flex;flex-wrap:wrap;gap:8px;margin-top:16px; }
    .quick button { background:var(--panel2);border:1px solid var(--border);color:var(--text);font-size:13px;font-weight:500;padding:9px 12px; }
    .chat-toolbar { display:flex;gap:7px;flex-wrap:wrap;margin:10px 0 0; }
    .chat-toolbar .tool-btn { padding:6px 9px;font-size:11px; }
    .assistant-content { white-space:normal;line-height:1.65; }
    .assistant-content p { margin:0 0 10px; }
    .assistant-content p:last-child { margin-bottom:0; }
    .assistant-content h1,.assistant-content h2,.assistant-content h3 { margin:14px 0 7px;line-height:1.3; }
    .assistant-content ul,.assistant-content ol { margin:7px 0 12px;padding-left:24px; }
    .assistant-content li { margin:4px 0; }
    .assistant-content pre { overflow:auto;padding:12px;border-radius:10px;background:#050505;border:1px solid var(--border);white-space:pre; }
    .assistant-content code { font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:.92em; }
    .assistant-content :not(pre) > code { background:#202020;padding:2px 5px;border-radius:5px; }
    .assistant-content a { color:var(--accent);text-decoration:underline; }
    .utility-row { display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 0;align-items:center; }
    .utility-row select { background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:8px; }
    .voice-status { color:var(--muted);font-size:11px;align-self:center; }
    .drawer-row { display:flex;align-items:flex-start;gap:8px;margin-top:5px; }
    .settings-drawer { flex:1;min-width:0;margin-top:0;border:0;border-radius:10px;background:transparent;overflow:visible; }
    .settings-drawer[open] { background:var(--panel);border:1px solid var(--border); }
    .settings-drawer > summary { display:flex;align-items:center;justify-content:center;gap:7px;padding:7px 9px;cursor:pointer;list-style:none;font-size:12px;font-weight:500;color:var(--muted);border:1px solid var(--border);border-radius:18px; }
    .settings-drawer > summary::-webkit-details-marker { display:none; }
    .settings-drawer > summary::after { content:'⌄';color:var(--muted);font-size:13px; }
    .settings-drawer[open] > summary { border-color:transparent; }
    .settings-drawer[open] > summary::after { content:'⌃'; }
    .drawer-hint { margin-left:auto;color:var(--muted);font-size:10px;font-weight:400;text-align:right; }
    .settings-grid,.drawer-content { padding:2px 11px 11px; }
    .settings-grid { display:grid;grid-template-columns:1fr 1fr;gap:9px;align-items:center; }
    .field-label { display:flex;flex-direction:column;gap:5px;color:var(--muted);font-size:12px; }
    .field-label select { width:100%;min-width:0;background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:10px;font:inherit;font-size:13px; }
    .settings-grid .web-search-toggle,.settings-grid .free-mode-toggle,.settings-grid .voice-conversation-toggle { grid-column:1 / -1;margin:0; }
    .settings-grid .mode-toggle { display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--border);border-radius:12px;color:var(--text);font-size:13px;line-height:1.35; }
    .settings-grid .mode-toggle input { flex:0 0 auto;margin:0;width:17px;height:17px; }
    .drawer-row { display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-top:10px;align-items:start; }
    .settings-drawer { width:100%; }
    .settings-drawer > summary { min-height:46px;padding:10px 12px;font-size:13px;font-weight:550;background:var(--panel); }
    .settings-drawer[open] { border-radius:14px;overflow:hidden; }
    .settings-grid { padding:10px;gap:10px; }
    .drawer-content { padding:4px 10px 10px; }
    .tools-drawer .tools { display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px; }
    .tools-drawer .tool-btn { min-height:40px;text-align:center;padding:9px 8px;overflow-wrap:anywhere; }
    .voice-status { grid-column:1 / -1; }
    .hint { margin-top:3px; }
    .settings-grid #theme-button { justify-self:start; }
    .primary-tools { margin-top:0; }
    .input-wrap { box-shadow:none; }
    #prompt { min-width:0;resize:none;min-height:44px;max-height:140px; }
    .hint { line-height:1.4;padding-top:6px;font-size:10px; }
    .tools-drawer .tools { margin-top:8px; }
    .tools-drawer .tool-btn { background:transparent;border-color:var(--border); }
    .selected-files:empty { display:none; }
    .selected-files { margin:0 0 7px; }
    .theme-button { align-self:start; }
    #send { min-width:76px; }
    .assistant { border-color:transparent;background:transparent; }
    .user { background:var(--panel2);border-color:var(--border); }
    .chat-toolbar { opacity:.78; }
    .chat-toolbar .tool-btn { background:transparent;border-color:transparent; }

    /* Visual inspirado na interface do ChatGPT; identidade ADA-M preservada. */
    :root { --bg:#212121; --panel:#2f2f2f; --panel2:#303030; --text:#ececec; --muted:#b4b4b4; --accent:#10a37f; --border:#424242; }
    body.light-theme { --bg:#ffffff; --panel:#f4f4f4; --panel2:#ececec; --text:#202123; --muted:#666a70; --accent:#0d8a68; --border:#e2e2e2; }
    body { font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; letter-spacing:-.01em; }
    .app { width:min(920px,100%); padding:18px 24px 16px; }
    header { border-bottom:0; padding:8px 2px 16px; }
    .logo { border-radius:50%; width:38px; height:38px; font-size:16px; }
    h1 { font-size:18px; letter-spacing:-.45px; font-weight:600; }
    .subtitle { font-size:12px; }
    #messages { gap:22px; padding:24px 0; }
    .welcome { background:transparent; border:0; border-radius:0; padding:28px 4px 22px; }
    .welcome h2 { font-size:28px; font-weight:600; letter-spacing:-.9px; }
    .welcome p { font-size:15px; }
    .bubble { border-radius:18px; padding:12px 16px; line-height:1.65; }
    .assistant { background:transparent; border:0; padding-left:2px; padding-right:2px; }
    .user { background:var(--panel2); border:0; border-radius:22px; }
    form { background:linear-gradient(180deg,transparent,var(--bg) 22%); padding:14px 0 6px; }
    .input-wrap { background:var(--panel); border:1px solid var(--border); border-radius:26px; padding:8px 9px 8px 14px; gap:8px; }
    #prompt { font-size:15px; line-height:1.6; padding:9px 5px; }
    #send { border-radius:50%; width:40px; min-width:40px; height:40px; padding:0; font-size:0; display:grid; place-items:center; }
    #send::after { content:"↑"; font-size:22px; line-height:1; }
    button { transition:background .15s ease, opacity .15s ease; }
    .tool-btn,.quick button { border-radius:18px; }
    .assistant-content { line-height:1.75; letter-spacing:0; }
    .assistant-content pre { background:#171717; border-radius:12px; }
    .hint { font-size:11px; }
    body.light-theme .assistant-content pre { background:#f4f4f4; }
    @media(max-width:520px) {
      .app { padding:10px 12px max(12px,env(safe-area-inset-bottom)); }
      .welcome h2 { font-size:23px; }
      .welcome { padding:22px 2px 18px; }
      .input-wrap { border-radius:24px; }
    }

    @media(max-width:520px) {
      .app{padding:10px 12px max(12px,env(safe-area-inset-bottom));min-height:100dvh;}
      header{padding:7px 2px 13px;gap:10px;}
      .logo{width:42px;height:42px;border-radius:13px;flex-shrink:0;}
      h1{font-size:19px;}
      .subtitle{font-size:12px;}
      .status{display:none;}
      #messages{gap:12px;padding:16px 0;min-height:180px;}
      .bubble{max-width:96%;padding:11px 13px;font-size:15px;}
      .welcome{padding:18px 15px;}
      .welcome h2{font-size:19px;}
      form{padding:8px 0 3px;background:var(--bg);}
      .input-wrap{gap:5px;padding:6px;border-radius:18px;}
      #prompt{padding:10px 8px;font-size:16px;min-height:44px;}
      #send{padding:12px 15px;white-space:nowrap;}
      .settings-drawer > summary{padding:10px 8px;font-size:12px;min-height:44px;}
      .drawer-row{gap:8px;margin-top:9px;}
      .settings-grid,.drawer-content{padding:9px;}
      .settings-grid{grid-template-columns:1fr 1fr;gap:8px;}
      .settings-grid .field-label{font-size:11px;}
      .settings-grid .field-label select{padding:9px 7px;font-size:12px;}
      .settings-grid .mode-toggle{font-size:12px;padding:9px;}
      .tools-drawer .tools{grid-template-columns:1fr;gap:7px;}
      .tools-drawer .tool-btn{width:100%;min-height:38px;}
      .tool-btn{padding:8px 10px;font-size:12px;}
      .tools{gap:6px;}
      .mode-toggle{font-size:12px;}
      .hint{font-size:10px;padding-top:5px;}
      .input-wrap{border-radius:16px;}
      .settings-drawer{margin-top:0;}
      .settings-drawer[open]{grid-column:1 / -1;}
      .drawer-row:has(.settings-drawer[open]){grid-template-columns:minmax(0,1fr) minmax(0,1fr);}
      .hint{padding:8px 4px 0;font-size:11px;}
      .status{display:none;}
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="logo" aria-hidden="true">M</div>
      <div><h1>ADA-M <span id="mode-badge" class="mode-badge">Modo normal</span></h1><div class="subtitle">Seu assistente pessoal</div></div>
      <div class="status">● pronto para conversar</div>
    </header>
    <section id="messages" aria-live="polite">
    </section>
    <form id="chat-form">
      <div id="selected-files" class="selected-files" aria-live="polite"></div>
      <input id="photo-input" type="file" accept="image/jpeg,image/png,image/webp" multiple hidden aria-label="Selecionar fotos">
      <input id="file-input" type="file" accept=".pdf,.docx,.xlsx,.xlsm,.txt,.md,.csv,.json,.py,.js,.ts,.html,.css,.xml,.yml,.yaml,.log,.sh,.toml,.ini,.sql,.java,.c,.cpp,.h,.go,.rs" multiple hidden aria-label="Selecionar arquivos">
      <div class="input-wrap">
        <textarea id="prompt" rows="1" maxlength="12000" placeholder="Escreva sua mensagem..." aria-label="Mensagem"></textarea>
        <button class="tool-btn" type="button" id="voice-button" aria-label="Iniciar voz" title="Iniciar voz" style="width:40px;min-width:40px;height:40px;padding:0;border-radius:50%;display:grid;place-items:center;flex-shrink:0" ><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3M8 22h8"/></svg></button>
        <button id="send" type="submit">Enviar</button>
      </div>
      <div class="drawer-row">
      <details class="settings-drawer">
        <summary>Preferências</summary>
        <div class="settings-grid">
          <label class="field-label" for="response-mode">Modo de resposta
            <select id="response-mode" aria-label="Modo de resposta">
              <option value="normal">Geral</option>
              <option value="programador">Programador</option>
              <option value="estudo">Estudo</option>
              <option value="criativo">Criativo</option>
            </select>
          </label>
          <label class="field-label" for="response-length">Tamanho da resposta
            <select id="response-length" aria-label="Tamanho da resposta">
              <option value="curta">Curta</option>
              <option value="normal">Normal</option>
              <option value="detalhada" selected>Detalhada</option>
            </select>
          </label>
          <label class="mode-toggle web-search-toggle"><input id="web-search-toggle" type="checkbox" checked> <span>Pesquisar na internet e citar fontes</span></label>
          <label class="mode-toggle free-mode-toggle"><input id="free-mode" type="checkbox"> <span>Modo livre</span></label>
          <label class="mode-toggle voice-conversation-toggle"><input id="voice-conversation-toggle" type="checkbox"> <span>Ler respostas automaticamente em voz alta</span></label>
          <button class="tool-btn theme-button" type="button" id="theme-button">Tema claro</button>
        </div>
      </details>
      <details class="settings-drawer tools-drawer">
        <summary>Ferramentas</summary>
        <div class="drawer-content">
          <div class="tools primary-tools">
            <button class="tool-btn" type="button" id="photo-button"><span>🖼️</span>Enviar fotos</button>
            <button class="tool-btn" type="button" id="file-button"><span>📎</span>Enviar arquivos</button>
            <button class="tool-btn" type="button" id="new-chat-button">Nova conversa</button>
            <button class="tool-btn" type="button" id="export-button">Exportar conversa</button>
            <button class="tool-btn" type="button" id="stop-button" hidden>Interromper</button>
            <span id="voice-status" class="voice-status" aria-live="polite"></span>
          </div>
        </div>
      </details>
      </div>
      <div id="diagnostics-panel" class="web-sources" hidden aria-live="polite"></div>
      <div class="hint">Enter para enviar · Shift+Enter para nova linha</div>
    </form>
  </main>
  <script>
    const messagesEl = document.getElementById('messages');
    const form = document.getElementById('chat-form');
    const promptEl = document.getElementById('prompt');
    const sendBtn = document.getElementById('send');
    const photoInput = document.getElementById('photo-input');
    const fileInput = document.getElementById('file-input');
    const selectedFilesEl = document.getElementById('selected-files');
    const freeModeToggle = document.getElementById('free-mode');
    const modeBadge = document.getElementById('mode-badge');
    const responseMode = document.getElementById('response-mode');
    const responseLength = document.getElementById('response-length');
    const webSearchToggle = document.getElementById('web-search-toggle');
    const stopButton = document.getElementById('stop-button');
    const voiceStatus = document.getElementById('voice-status');
    let activeController = null;
    function updateModeBadge() {
      modeBadge.textContent = freeModeToggle.checked ? 'Modo Livre' :
        ({normal:'Modo geral',programador:'Programador',estudo:'Estudo',criativo:'Criativo'}[responseMode.value] || 'Modo geral');
    }
    freeModeToggle.addEventListener('change', updateModeBadge);
    responseMode.addEventListener('change', updateModeBadge);
    document.getElementById('theme-button').addEventListener('click', () => {
      document.body.classList.toggle('light-theme');
      const light = document.body.classList.contains('light-theme');
      document.getElementById('theme-button').textContent = light ? 'Tema escuro' : 'Tema claro';
      try { localStorage.setItem('matheus-ai-theme', light ? 'light' : 'dark'); } catch {}
    });
    try {
      if (localStorage.getItem('matheus-ai-theme') === 'light') {
        document.body.classList.add('light-theme');
        document.getElementById('theme-button').textContent = 'Tema escuro';
      }
    } catch {}
    const selectedFiles = [];
    const history = [];
    function resizePrompt() {
      promptEl.style.height = 'auto';
      promptEl.style.height = Math.min(promptEl.scrollHeight, 200) + 'px';
      promptEl.style.overflowY = promptEl.scrollHeight > 200 ? 'auto' : 'hidden';
    }
    promptEl.addEventListener('input', resizePrompt);
    promptEl.addEventListener('keydown', event => {
      if (event.key === 'Enter' && !event.shiftKey && !event.isComposing) {
        event.preventDefault();
        if (typeof form.requestSubmit === 'function') form.requestSubmit();
        else sendBtn.click();
      }
    });
    resizePrompt();
    const MAX_FILE_BYTES = 5 * 1024 * 1024;
    const MAX_FILES = 3;

    document.querySelectorAll('[data-prompt]').forEach(button => {
      button.addEventListener('click', () => { promptEl.value = button.dataset.prompt; promptEl.focus(); });
    });
    document.getElementById('stop-button').addEventListener('click', () => {
      if (activeController) activeController.abort();
    });
    document.getElementById('new-chat-button').addEventListener('click', () => {
      if (activeController) activeController.abort();
      history.splice(0, history.length);
      messagesEl.replaceChildren();
      promptEl.value = '';
      showWelcome();
    });
    document.getElementById('export-button').addEventListener('click', exportConversation);
    document.getElementById('voice-button').addEventListener('click', toggleVoiceInput);
    const voiceConversationToggle = document.getElementById('voice-conversation-toggle');

    function speakText(text) {
      if (!('speechSynthesis' in window)) { voiceStatus.textContent = 'Leitura de voz não suportada neste navegador.'; return; }
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'pt-BR';
      window.speechSynthesis.speak(utterance);
    }

    async function loadDiagnostics() {
      const panel = document.getElementById('diagnostics-panel');
      panel.hidden = false;
      panel.textContent = 'Verificando aplicação, provedor e pesquisa…';
      try {
        const response = await fetch('/api/diagnostics', { headers: { 'Accept': 'application/json' } });
        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || 'Não foi possível consultar o diagnóstico.');
        panel.replaceChildren();
        const heading = document.createElement('strong');
        heading.textContent = 'Saúde e diagnóstico da IA';
        panel.appendChild(heading);
        const list = document.createElement('ul');
        const rows = [
          ['Aplicação', data.app],
          ['Provedor do modelo', data.model?.status || 'não verificado'],
          ['Latência do provedor', data.model?.latency_ms == null ? 'não medida' : data.model.latency_ms + ' ms'],
          ['Tempo ativo', (data.uptime_seconds || 0) + ' s'],
          ['Conversas recebidas / respostas concluídas', (data.metrics?.requests || 0) + ' / ' + (data.metrics?.successes || 0)],
          ['Falhas registradas', String(data.metrics?.errors || 0)],
          ['Pesquisas tentadas / concluídas', (data.metrics?.searches || 0) + ' / ' + (data.metrics?.search_successes || 0)],
          ['Último provedor de pesquisa', data.search?.last_provider || 'ainda não registrado'],
          ['Último erro', data.last_error || 'nenhum registrado']
        ];
        for (const [label, value] of rows) {
          const li = document.createElement('li');
          li.textContent = label + ': ' + value;
          list.appendChild(li);
        }
        panel.appendChild(list);
        const providers = document.createElement('p');
        providers.textContent = 'Pesquisa configurada: ' + Object.entries(data.search?.providers || {}).map(([name, enabled]) => name + ' (' + (enabled ? 'configurado' : 'não configurado') + ')').join(' · ');
        panel.appendChild(providers);
        const note = document.createElement('p');
        note.textContent = data.note || 'O diagnóstico não exibe segredos nem conteúdo das conversas.';
        panel.appendChild(note);
      } catch (error) {
        panel.textContent = 'Falha ao consultar diagnóstico: ' + (error.message || 'erro desconhecido');
      }
    }

    function showWelcome() {
      const welcome = document.createElement('div');
      welcome.id = 'welcome'; welcome.className = 'welcome';
      const title = document.createElement('h2'); title.textContent = 'Olá! Sou o ADA-M.';
      const description = document.createElement('p'); description.textContent = 'Como posso ajudar você hoje?';
      welcome.append(title, description); messagesEl.appendChild(welcome);
    }

    document.getElementById('photo-button').addEventListener('click', () => photoInput.click());
    document.getElementById('file-button').addEventListener('click', () => fileInput.click());

    photoInput.addEventListener('change', () => { addSelectedFiles([...photoInput.files]); photoInput.value = ''; });
    fileInput.addEventListener('change', () => { addSelectedFiles([...fileInput.files]); fileInput.value = ''; });
    promptEl.addEventListener('keydown', event => {
      if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); form.requestSubmit(); }
    });

    function addSelectedFiles(files) {
      for (const file of files) {
        if (selectedFiles.length >= MAX_FILES) { alert('Você pode anexar até 3 arquivos por mensagem.'); break; }
        if (file.size > MAX_FILE_BYTES) { alert('O arquivo "' + file.name + '" ultrapassa o limite de 5 MB.'); continue; }
        if (selectedFiles.some(item => item.name === file.name && item.size === file.size)) continue;
        const isImage = ['image/jpeg','image/png','image/webp'].includes(file.type);
        const isPdf = file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf');
        if (!isImage && !isPdf && !/\.(docx|xlsx|xlsm|txt|md|csv|json|py|js|ts|html|css|xml|ya?ml|log|sh|toml|ini|sql|java|c|cpp|h|go|rs)$/i.test(file.name)) {
          alert('Formato não suportado: ' + file.name);
          continue;
        }
        selectedFiles.push(file);
      }
      renderSelectedFiles();
    }

    let objectRemoverWindow = null;
    let pendingObjectRemoverFile = null;
    function openObjectRemover(file) {
      pendingObjectRemoverFile = file;
      objectRemoverWindow = window.open('/static/object-remover.html', 'matheusAiObjectRemover', 'popup,width=1100,height=850');
      if (!objectRemoverWindow) {
        voiceStatus.textContent = 'O navegador bloqueou a janela. Permita pop-ups para abrir o editor.';
        return;
      }
      voiceStatus.textContent = 'Editor de remoção de objetos aberto. A imagem será enviada diretamente ao editor local.';
    }
    window.addEventListener('message', event => {
      if (event.origin !== window.location.origin) return;
      if (event.data?.type === 'matheus-ai-object-remover-ready' && pendingObjectRemoverFile && objectRemoverWindow && !objectRemoverWindow.closed) {
        objectRemoverWindow.postMessage({ type: 'matheus-ai-image', file: pendingObjectRemoverFile }, window.location.origin);
        pendingObjectRemoverFile = null;
      }
      if (event.data?.type === 'matheus-ai-edited-image' && event.data.file instanceof Blob) {
        const edited = event.data.file instanceof File ? event.data.file : new File([event.data.file], 'matheus-ai-sem-objetos.png', { type: 'image/png' });
        selectedFiles.splice(0, selectedFiles.length, ...selectedFiles.filter(file => !file.name.startsWith('matheus-ai-sem-objetos')));
        selectedFiles.push(edited);
        renderSelectedFiles();
        voiceStatus.textContent = 'Imagem editada anexada ao chat. Envie uma mensagem para usá-la na conversa.';
      }
    });

    function renderSelectedFiles() {
      selectedFilesEl.replaceChildren();
      selectedFiles.forEach((file, index) => {
        const chip = document.createElement('div');
        chip.className = 'selected-file';
        const label = document.createElement('span');
        label.textContent = (file.type.startsWith('image/') ? '📷 ' : '📄 ') + file.name;
        const remove = document.createElement('button');
        remove.type = 'button';
        remove.className = 'remove-file';
        remove.setAttribute('aria-label', 'Remover ' + file.name);
        remove.textContent = '×';
        remove.addEventListener('click', () => { selectedFiles.splice(index, 1); renderSelectedFiles(); });
        chip.append(label);
        if (file.type.startsWith('image/')) {
          const editImage = document.createElement('button');
          editImage.type = 'button';
          editImage.className = 'remove-file';
          editImage.title = 'Remover objetos desta imagem';
          editImage.setAttribute('aria-label', 'Remover objetos de ' + file.name);
          editImage.textContent = '✦';
          editImage.addEventListener('click', () => openObjectRemover(file));
          chip.appendChild(editImage);
        }
        chip.append(remove);
        selectedFilesEl.appendChild(chip);
      });
    }

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result).split(',')[1] || '');
        reader.onerror = () => reject(new Error('Falha ao ler o arquivo ' + file.name));
        reader.readAsDataURL(file);
      });
    }

    async function serializeFile(file) {
      const data = await fileToBase64(file);
      const isImage = ['image/jpeg','image/png','image/webp'].includes(file.type);
      if (isImage) return { type: 'image', name: file.name, mime_type: file.type, data };
      const lowerName = file.name.toLowerCase();
      const isPdf = file.type === 'application/pdf' || lowerName.endsWith('.pdf');
      const mimeByExtension = lowerName.endsWith('.docx') ? 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' : (lowerName.endsWith('.xlsx') || lowerName.endsWith('.xlsm')) ? 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' : '';
      return { type: 'file', name: file.name, mime_type: isPdf ? 'application/pdf' : (mimeByExtension || file.type || 'text/plain'), data };
    }

    function renderMarkdown(text) {
      const root = document.createElement('div');
      root.className = 'assistant-content';
      const lines = String(text || '').replace(/\r/g, '').split('\n');
      let paragraph = [], list = null, codeLines = null;
      const flushParagraph = () => {
        if (!paragraph.length) return;
        const p = document.createElement('p');
        renderInline(p, paragraph.join(' '));
        root.appendChild(p);
        paragraph = [];
      };
      const flushList = () => { if (list) { root.appendChild(list); list = null; } };
      for (const line of lines) {
        if (line.trim().startsWith(String.fromCharCode(96).repeat(3))) {
          flushParagraph(); flushList();
          if (codeLines !== null) {
            const pre = document.createElement('pre');
            const code = document.createElement('code');
            code.textContent = codeLines.join('\n');
            pre.appendChild(code); root.appendChild(pre); codeLines = null;
          } else {
            codeLines = [];
          }
          continue;
        }
        if (codeLines !== null) { codeLines.push(line); continue; }
        if (!line.trim()) { flushParagraph(); flushList(); continue; }
        const heading = line.match(/^(#{1,3})\s+(.+)$/);
        if (heading) {
          flushParagraph(); flushList();
          const h = document.createElement('h' + heading[1].length);
          renderInline(h, heading[2]); root.appendChild(h); continue;
        }
        const item = line.match(/^\s*[-*]\s+(.+)$/);
        const ordered = line.match(/^\s*\d+\.\s+(.+)$/);
        if (item || ordered) {
          flushParagraph();
          const tag = ordered ? 'ol' : 'ul';
          if (!list || list.tagName.toLowerCase() !== tag) { flushList(); list = document.createElement(tag); }
          const li = document.createElement('li');
          renderInline(li, (item || ordered)[1]); list.appendChild(li); continue;
        }
        flushList();
        paragraph.push(line.trim());
      }
      flushParagraph(); flushList();
      if (codeLines !== null) {
        const pre = document.createElement('pre'), code = document.createElement('code');
        code.textContent = codeLines.join('\n'); pre.appendChild(code); root.appendChild(pre);
      }
      return root;
    }

    function renderInline(parent, text) {
      const pattern = new RegExp('\\*\\*(.+?)\\*\\*|\\*([^*]+)\\*|\\x60([^\\x60]+)\\x60|\\[([^\\]]+)\\]\\((https?:\\/\\/[^\\s)]+)\\)', 'g');
      let cursor = 0, match;
      while ((match = pattern.exec(text)) !== null) {
        parent.appendChild(document.createTextNode(text.slice(cursor, match.index)));
        let node;
        if (match[1] !== undefined) { node = document.createElement('strong'); node.textContent = match[1]; }
        else if (match[2] !== undefined) { node = document.createElement('em'); node.textContent = match[2]; }
        else if (match[3] !== undefined) { node = document.createElement('code'); node.textContent = match[3]; }
        else {
          node = document.createElement('a'); node.textContent = match[4]; node.href = match[5];
          node.target = '_blank'; node.rel = 'noopener noreferrer';
        }
        parent.appendChild(node);
        cursor = pattern.lastIndex;
      }
      parent.appendChild(document.createTextNode(text.slice(cursor)));
    }

    // Converte referências numéricas como [1] ou [1, 2] em links para as fontes
    // correspondentes, sem interpretar HTML fornecido pelo modelo.
    function linkCitationReferences(root, sources = []) {
      if (!Array.isArray(sources) || !sources.length) return;
      const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
      const textNodes = [];
      while (walker.nextNode()) {
        const node = walker.currentNode;
        if (node.parentElement?.closest('a, code, pre, script, style')) continue;
        if (/\[\d+(?:\s*,\s*\d+)*\]/.test(node.nodeValue || '')) textNodes.push(node);
      }
      const citationPattern = /\[(\d+(?:\s*,\s*\d+)*)\]/g;
      for (const textNode of textNodes) {
        const value = textNode.nodeValue || '';
        const fragment = document.createDocumentFragment();
        let cursor = 0, match;
        citationPattern.lastIndex = 0;
        while ((match = citationPattern.exec(value)) !== null) {
          fragment.appendChild(document.createTextNode(value.slice(cursor, match.index)));
          const numbers = match[1].split(',').map(number => Number(number.trim()));
          let linkedAny = false;
          numbers.forEach((number, index) => {
            if (index) fragment.appendChild(document.createTextNode(', '));
            const source = sources[number - 1];
            if (source && typeof source.url === 'string' && /^https?:\/\//i.test(source.url)) {
              const link = document.createElement('a');
              link.href = source.url;
              link.target = '_blank';
              link.rel = 'noopener noreferrer';
              link.textContent = '[' + number + ']';
              link.title = source.title || source.url;
              link.setAttribute('aria-label', 'Abrir fonte ' + number + ': ' + (source.title || source.url));
              fragment.appendChild(link);
              linkedAny = true;
            } else {
              fragment.appendChild(document.createTextNode('[' + number + ']'));
            }
          });
          cursor = match.index + match[0].length;
        }
        if (cursor === 0) continue;
        fragment.appendChild(document.createTextNode(value.slice(cursor)));
        textNode.parentNode?.replaceChild(fragment, textNode);
      }
    }

    function displayAssistantReply(bubble, text, sources = []) {
      const rendered = renderMarkdown(text);
      linkCitationReferences(rendered, sources);
      bubble.replaceChildren(rendered);
      const actions = document.createElement('div');
      actions.className = 'chat-toolbar';
      const copy = document.createElement('button');
      copy.type = 'button'; copy.className = 'tool-btn'; copy.textContent = 'Copiar';
      copy.addEventListener('click', async () => {
        try { await navigator.clipboard.writeText(text); voiceStatus.textContent = 'Resposta copiada.'; }
        catch { voiceStatus.textContent = 'O navegador não permitiu copiar automaticamente.'; }
      });
      const edit = document.createElement('button');
      edit.type = 'button'; edit.className = 'tool-btn'; edit.textContent = 'Editar pergunta';
      edit.addEventListener('click', () => {
        const lastUser = [...history].reverse().find(item => item.role === 'user');
        promptEl.value = lastUser ? contentText(lastUser.content) : '';
        promptEl.focus();
      });
      const speak = document.createElement('button');
      speak.type = 'button'; speak.className = 'tool-btn'; speak.textContent = 'Ler em voz alta';
      speak.addEventListener('click', () => speakText(text));
      const regenerate = document.createElement('button');
      regenerate.type = 'button'; regenerate.className = 'tool-btn'; regenerate.textContent = 'Regenerar';
      regenerate.addEventListener('click', () => {
        if (sendBtn.disabled) return;
        const lastAssistantIndex = history.map(item => item.role).lastIndexOf('assistant');
        if (lastAssistantIndex >= 0) history.splice(lastAssistantIndex, 1);
        const lastUserIndex = history.map(item => item.role).lastIndexOf('user');
        if (lastUserIndex < 0) return;
        const previousQuestion = contentText(history[lastUserIndex].content);
        history.splice(lastUserIndex, 1);
        const assistantBubbles = [...messagesEl.querySelectorAll('.bubble.assistant')];
        const userBubbles = [...messagesEl.querySelectorAll('.bubble.user')];
        assistantBubbles[assistantBubbles.length - 1]?.remove();
        userBubbles[userBubbles.length - 1]?.remove();
        promptEl.value = previousQuestion;
        form.requestSubmit();
      });
      if (Array.isArray(sources) && sources.length) {
        const sourcePanel = document.createElement('section');
        sourcePanel.className = 'web-sources';
        const heading = document.createElement('strong');
        heading.textContent = 'Fontes da internet';
        sourcePanel.appendChild(heading);
        const list = document.createElement('ol');
        sources.forEach(source => {
          if (!source || typeof source.url !== 'string' || !/^https?:\/\//i.test(source.url)) return;
          const item = document.createElement('li');
          const link = document.createElement('a');
          link.href = source.url;
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
          link.textContent = source.title || source.url;
          item.appendChild(link);
          if (source.snippet) {
            const snippet = document.createElement('p');
            snippet.textContent = source.snippet;
            item.appendChild(snippet);
          }
          list.appendChild(item);
        });
        if (list.childNodes.length) {
          sourcePanel.appendChild(list);
          bubble.appendChild(sourcePanel);
        }
      }
      actions.append(copy, edit, speak, regenerate);
      bubble.appendChild(actions);
    }

    function contentText(content) {
      if (typeof content === 'string') return content;
      return Array.isArray(content) ? content.map(part => part && part.type === 'text' ? part.text || '' : '').join(' ') : '';
    }

    function exportConversation() {
      if (!history.length) { alert('Não há mensagens para exportar.'); return; }
      const output = '# ADA-M\n\n' + history.map(item =>
        (item.role === 'user' ? '## Você' : '## ADA-M') + '\n\n' + contentText(item.content)
      ).join('\n\n---\n\n');
      const blob = new Blob([output], { type: 'text/markdown;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url; link.download = 'conversa-matheus-ai.md'; link.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    let recognition = null;
    function toggleVoiceInput() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) { voiceStatus.textContent = 'Reconhecimento de voz não suportado neste navegador.'; return; }
      if (recognition) { recognition.stop(); recognition = null; voiceStatus.textContent = ''; return; }
      recognition = new SpeechRecognition();
      recognition.lang = 'pt-BR'; recognition.interimResults = false; recognition.maxAlternatives = 1;
      recognition.onresult = event => { promptEl.value = event.results[0][0].transcript; promptEl.focus(); voiceStatus.textContent = 'Voz convertida em texto.'; };
      recognition.onerror = () => { voiceStatus.textContent = 'Não foi possível reconhecer a voz.'; recognition = null; };
      recognition.onend = () => { recognition = null; };
      voiceStatus.textContent = 'Ouvindo…'; recognition.start();
    }

    function addBubble(text, role, extraClass='', files=[]) {
      document.getElementById('welcome')?.remove();
      const bubble = document.createElement('div');
      bubble.className = 'bubble ' + role + (extraClass ? ' ' + extraClass : '');
      const textNode = document.createElement('div');
      textNode.textContent = text;
      bubble.appendChild(textNode);
      if (files.length) {
        const attachments = document.createElement('div');
        attachments.className = 'attachments';
        files.forEach(file => {
          if (file.type.startsWith('image/')) {
            const image = document.createElement('img');
            image.className = 'bubble-image';
            image.alt = file.name;
            image.src = URL.createObjectURL(file);
            bubble.appendChild(image);
          } else {
            const chip = document.createElement('div');
            chip.className = 'attachment-chip';
            chip.textContent = '📎 ' + file.name;
            attachments.appendChild(chip);
          }
        });
        if (attachments.childNodes.length) bubble.appendChild(attachments);
      }
      messagesEl.appendChild(bubble);
      bubble.scrollIntoView({ behavior: 'smooth', block: 'end' });
      return bubble;
    }


    form.addEventListener('submit', async event => {
      event.preventDefault();
      const text = promptEl.value.trim();
      if ((!text && selectedFiles.length === 0) || sendBtn.disabled) return;

      const files = [...selectedFiles];
      const userText = text || 'Analise os arquivos anexados.';
      
      let content;
      try {
        content = [{ type: 'text', text: userText }];
        for (const file of files) content.push(await serializeFile(file));
      } catch (error) {
        addBubble('Erro: ' + (error.message || 'Não foi possível ler o arquivo.'), 'assistant', 'error');
        return;
      }
      const userMessage = { role: 'user', content };
      history.push(userMessage);
      while (history.length > 12) history.shift();
      addBubble(userText, 'user', '', files);
      promptEl.value = '';
      selectedFiles.splice(0, selectedFiles.length);
      renderSelectedFiles();
      sendBtn.disabled = true;
      sendBtn.textContent = '...';
      stopButton.hidden = false;
      activeController = new AbortController();
      const pending = addBubble('Analisando...', 'assistant');
      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          signal: activeController.signal,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages: history, mode: freeModeToggle.checked ? "livre" : responseMode.value, response_length: responseLength.value, web_search: webSearchToggle.checked, stream: true })
        });
        if (!response.ok) {
          const failureText = await response.text();
          let detail = failureText;
          try { detail = JSON.parse(failureText).detail || failureText; } catch {}
          throw new Error(String(detail).replace(/<[^>]*>/g, ' ').slice(0, 300) || `Falha na solicitação (HTTP ${response.status}).`);
        }
        if (!response.body) throw new Error('Este navegador não oferece suporte à resposta em tempo real.');
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '', answer = '', streamSources = [];
        const consumeEvent = eventText => {
          let eventName = 'message', dataText = '';
          for (const line of eventText.split('\n')) {
            if (line.startsWith('event:')) eventName = line.slice(6).trim();
            else if (line.startsWith('data:')) dataText += line.slice(5).trim();
          }
          if (!dataText) return;
          let payload;
          try { payload = JSON.parse(dataText); } catch { return; }
          if (eventName === 'error') throw new Error(payload.detail || 'A geração falhou.');
          if (eventName === 'done') { streamSources = Array.isArray(payload.sources) ? payload.sources : []; return; }
          if (typeof payload.token === 'string') {
            answer += payload.token;
            pending.replaceChildren(renderMarkdown(answer));
            pending.scrollIntoView({ behavior: 'smooth', block: 'end' });
          }
        };
        try {
          while (true) {
            const { value, done } = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, { stream: true });
            const events = buffer.split('\n\n');
            buffer = events.pop() || '';
            for (const eventText of events) consumeEvent(eventText);
          }
          buffer += decoder.decode();
          if (buffer.trim()) consumeEvent(buffer);
        } finally { reader.releaseLock(); }
        if (!answer.trim()) throw new Error('O modelo encerrou a conexão sem retornar texto.');
        displayAssistantReply(pending, answer, streamSources);
        if (voiceConversationToggle.checked) speakText(answer);
        history.push({ role: 'assistant', content: answer });
        while (history.length > 12) history.shift();
      } catch (error) {
        if (error.name === 'AbortError') {
          pending.textContent = 'Geração interrompida.';
          pending.classList.add('error');
          history.pop();
        } else {
          pending.textContent = 'Erro: ' + (error.message || 'Falha de conexão.');
          pending.classList.add('error');
          history.pop();
        }
      } finally {
        sendBtn.disabled = false;
        sendBtn.textContent = 'Enviar';
        stopButton.hidden = true;
        activeController = null;
        promptEl.focus();
      }
    });
  </script>
