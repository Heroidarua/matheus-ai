name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Install isolated browser service test dependencies
        run: pip install -r browser-service/requirements.txt
      - name: Run tests with hang diagnostics
        env:
          MODEL_BASE_URL: http://127.0.0.1:11434/v1
          OPENAI_API_KEY: test-key
        run: |
          python -m pytest tests -vv -x -o faulthandler_timeout=120
          python -m pytest browser-service/tests -vv -x -o faulthandler_timeout=120
