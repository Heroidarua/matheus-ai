services:
  - type: web
    name: matheus-ai
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: MODEL_BASE_URL
        sync: false
      - key: MODEL_NAME
        value: qwen2.5:3b
      - key: GOOGLE_GEMINI_API_KEY
        sync: false
      - key: GOOGLE_SEARCH_MODEL
        value: gemini-3.8-flash
      - key: KNOWLEDGE_DIR
        value: data/knowledge
      - key: OPENAI_API_KEY
        sync: false
      - key: APP_API_KEY
        sync: false
      - key: SEARXNG_URL
        sync: false
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_APP_SLUG
        sync: false
      - key: GITHUB_APP_PRIVATE_KEY
        sync: false
      - key: GITHUB_SESSION_SECRET
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      - key: COOKIE_HTTPS_ONLY
        value: "true"
