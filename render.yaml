services:
  - type: web
    name: matheus-ai
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: MODEL_BASE_URL
        sync: false
      - key: MODEL_NAME
        value: qwen2.5:3b
      - key: GOOGLE_GEMINI_API_KEY
        sync: false
      - key: GOOGLE_SEARCH_MODEL
        value: gemini-3.8-flash
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: TTS_API_URL
        sync: false
      - key: TTS_API_KEY
        sync: false
      - key: TTS_VOICE
        value: pf_dora
      - key: GOOGLE_TOKEN_ENCRYPTION_KEY
        sync: false
      - key: KNOWLEDGE_DIR
        value: data/knowledge
      - key: OPENAI_API_KEY
        sync: false
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: IMAGE_GENERATION_MODEL
        value: "@cf/black-forest-labs/flux-1-schnell"
      - key: IMAGE_EDIT_MODEL
        value: "@cf/black-forest-labs/flux-2-klein-9b"
      - key: APP_API_KEY
        sync: false
      - key: SEARXNG_URL
        sync: false
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_APP_SLUG
        sync: false
      - key: GITHUB_APP_PRIVATE_KEY
        sync: false
      - key: GITHUB_SESSION_SECRET
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      - key: COOKIE_HTTPS_ONLY
        value: "true"
